name: CI - MLflow Training Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  training:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install Dependencies
        run: |
          pip install mlflow==2.19.0 scikit-learn pandas numpy dagshub matplotlib

      - name: Run MLflow Project
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/shandylatoz851/Obesity-MLflow.mlflow
          MLFLOW_TRACKING_USERNAME: shandylatoz851
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          cd MLProject
          mlflow run . --env-manager=local -P n_estimators=200 -P max_depth=10 -P min_samples_split=5

      - name: Upload Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            MLProject/confusion_matrix.png
            MLProject/classification_report.json

      - name: Commit Artifact to Repository
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add MLProject/confusion_matrix.png MLProject/classification_report.json
          git diff --staged --quiet || git commit -m "Auto: update model artifacts"
          git push

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          mlflow models build-docker \
            --model-uri "runs:/$(cat MLProject/run_id.txt)/model" \
            --name "${{ secrets.DOCKER_USERNAME }}/obesity-mlflow:latest"

      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/obesity-mlflow:latest